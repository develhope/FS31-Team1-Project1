<body>
    <section class="dream">
        <div class="dream-head">
            <div class="dhead-bg">
                <img src="#" alt="2 modelli LEGO DREAMZzz su un cielo blu scuro pieno di nuvole">
            </div>
            <div class="dhead-banner">
                <div class="dhead-logo">
                    <img src="#" alt="Logo serie DREAMZzz LEGO">
                </div>
                <div class="dhead-mid">
                    <h2>Scegli la costruzione: cambia la tua storia</h2>
                    <span>Fai vivere ai bambini un'avventura da sogno come mai prima d'ora!</span>
                    <div class="dhead-buttons">
                        <a class="button d-btn">Acquista LEGO® DREAMZzz™
                            <svg width="18" height="28" viewBox="0 0 18 28" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" class="Icon__StyledSVG-sc-lm07h6-0 jkUmZk Chevronstyles__ChevronIcon-sc-1qql32m-0 cEWHhy HeroBannerstyles__StyledChevron-sc-22eq7p-14 kRIbhw"><path d="M1.825 28L18 14 1.825 0 0 1.715 14.196 14 0 26.285z" fill="currentColor"></path></svg>
                        </a>
                        <a class="button d-btn">Scopri di più
                            <svg width="18" height="28" viewBox="0 0 18 28" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" class="Icon__StyledSVG-sc-lm07h6-0 jkUmZk Chevronstyles__ChevronIcon-sc-1qql32m-0 cEWHhy HeroBannerstyles__StyledChevron-sc-22eq7p-14 kRIbhw"><path d="M1.825 28L18 14 1.825 0 0 1.715 14.196 14 0 26.285z" fill="currentColor"></path></svg>
                        </a>
                    </div>
                </div>
            </div>

        </div>
        <div class="dream-mid">

        </div>
        <div class="dream-foot">
            <div class="dfoot-bg">
                <img src="#" alt="Grafica a forma di nuvola con una scena della serie TV LEGO DREAMZzz">
            </div>
            <div class="dfoot-banner">
                <div class="dfoot-logo">
                    <img src="#" alt="Logo serie DREAMZzz LEGO">
                </div>
                <div class="dfoot-left">
                    <h2>Difendi il mondo dei sogni</h2>
                    <span>Guarda subito la seconda stagione della serie TV LEGO® DREAMZzz™.</span>
                    <div class="dfoot-button">
                        <a class="button d-btn">Guarda ora
                            <svg width="18" height="28" viewBox="0 0 18 28" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" class="Icon__StyledSVG-sc-lm07h6-0 jkUmZk Chevronstyles__ChevronIcon-sc-1qql32m-0 cEWHhy HeroBannerstyles__StyledChevron-sc-22eq7p-14 kRIbhw"><path d="M1.825 28L18 14 1.825 0 0 1.715 14.196 14 0 26.285z" fill="currentColor"></path></svg>

                </div>
            </div>
